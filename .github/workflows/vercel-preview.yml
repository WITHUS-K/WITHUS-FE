name: Vercel Preview on PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop]

jobs:
  preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ⚙️ Enable Corepack & set PNPM
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: 📦 Install
        run: pnpm install --frozen-lockfile

      - name: ⬇️ Pull Vercel env (preview)
        run: npx vercel pull --yes --environment=preview --token "$VERCEL_TOKEN"

      - name: 🧱 Build workspaces first
        run: |
          pnpm -w install --frozen-lockfile
          pnpm -r build

      - name: 🏗️ vercel build
        run: npx vercel build --token "$VERCEL_TOKEN"

      - name: 🚀 vercel deploy (prebuilt)
        id: deploy
        run: |
          URL=$(npx vercel deploy --prebuilt --token "$VERCEL_TOKEN")
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"

      - name: 🔗 Attach PR alias
        id: alias
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        run: |
          PR=${{ github.event.pull_request.number }}
          ALIAS="pr-${PR}.preview.withus.co.kr"
          npx vercel alias set "$PREVIEW_URL" "$ALIAS" --token "$VERCEL_TOKEN"
          echo "alias_url=https://${ALIAS}" >> "$GITHUB_OUTPUT"

      - name: 💬 Comment Preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          ALIAS_URL: ${{ steps.alias.outputs.alias_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { repo, owner } = context.repo;
            const number = context.payload.pull_request.number;
            const marker = '<!-- vercel-preview-comment -->';
            const url = process.env.PREVIEW_URL;
            const alias = process.env.ALIAS_URL;
            const body = `${marker}
                         ✅ **Vercel Preview**: ${url}
                        🔗 **Fixed PR URL**: ${alias}`;

            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number: number });
            const prev = comments.find(c => c.body?.includes(marker));

            if (prev) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: prev.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }

      - name: 🧾 Add job summary
        run: |
          echo "### Vercel Preview" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.deploy.outputs.preview_url }}" >> $GITHUB_STEP_SUMMARY
          echo "### Fixed PR URL" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.alias.outputs.alias_url }}" >> $GITHUB_STEP_SUMMARY
